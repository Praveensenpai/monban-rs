name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    name: Build & Publish (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-gnu
          cache-all-crates: "true"

      - name: Build release binary
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Package archive & compute checksums
        shell: bash
        run: |
          mkdir -p dist
          SRC_BIN="target/x86_64-unknown-linux-gnu/release/monban-rs"
          cp "${SRC_BIN}" monban-rs
          tar -czf "dist/monban-rs-x86_64-linux.tar.gz" monban-rs yolov8n.onnx
          cd dist
          sha256sum * > "monban-rs-x86_64-linux.tar.gz.sha256"

      - name: Upload archives to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
