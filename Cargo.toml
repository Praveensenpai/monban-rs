[package]
name = "monban-rs"
version = "0.3.5"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
ndarray = "0.17.2"
ort = { version = "=2.0.0-rc.13", features = ["load-dynamic"] }
reqwest = { version = "0.13.5", features = ["blocking", "multipart"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.21"
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
